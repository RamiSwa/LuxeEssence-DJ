{% extends "base.html" %}
{% block content %}
<section class="login-area py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="login-wrapper shadow-lg p-5 bg-white rounded">
                    <h2 class="text-center mb-4">Login</h2>
                    <form id="loginForm" action="{% url 'login' %}" method="post">
                        {% csrf_token %}
                        
                        <!-- Email -->
                        <div class="form-group mb-3">
                            <input type="email" class="form-control form-control-lg" name="email" placeholder="Email" required>
                            {% if form.email.errors %}
                                <div class="invalid-feedback d-block">{{ form.email.errors.0 }}</div>
                            {% endif %}
                        </div>

                        <!-- Password -->
                        <div class="form-group mb-3 position-relative">
                            <input type="password" class="form-control form-control-lg" id="loginPassword" name="password" placeholder="Password" required>
                            {% if form.password.errors %}
                                <div class="invalid-feedback d-block">{{ form.password.errors.0 }}</div>
                            {% endif %}
                        </div>

                        <!-- Remember Me and Forgot Password -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember" name="remember">
                                <label class="form-check-label" for="remember">Remember me</label>
                            </div>
                            <a href="{% url 'forgot_password' %}" class="text-muted">Forgot Password?</a>
                        </div>

                        <!-- Social Login Buttons -->
                        <div class="mb-3 text-center">
                            <span>Or login with</span>
                            <div class="social-login mt-3 d-flex justify-content-center gap-3">
                                <button class="btn btn-light border"><i class="fab fa-google"></i> Google</button>
                                <button class="btn btn-light border"><i class="fab fa-facebook"></i> Facebook</button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Login</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
