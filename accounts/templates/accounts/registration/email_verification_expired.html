{% extends "base.html" %}

{% block content %}
<section class="email-verification py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="email-verification-wrapper shadow-lg p-5 bg-white rounded">
                    <h2 class="text-center mb-4">Email Verification Expired</h2>
                    <p>Your verification link has expired. Please request a new verification email.</p>
                    <div class="d-grid">
                        <a href="{% url 'resend_verification_link' %}" class="btn btn-primary btn-lg">Resend Verification Link</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
