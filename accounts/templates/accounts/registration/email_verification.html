<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verification</title>
</head>
<body>
    <p>Hello {{ user.first_name }},</p>
    <p>Thank you for registering with Luxe Essence. Please click the link below to verify your email address and complete your registration:</p>
    <p><a href="http://{{ domain }}/accounts/activate/{{ uid }}/{{ token }}/">Activate your account</a></p>
    <p>If you didn't register for an account, please ignore this email.</p>
    <p>Best regards,<br>Luxe Essence Team</p>
</body>
</html>
