{% extends "base.html" %}

{% block content %}
<section class="email-verification-sent py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="email-verification-wrapper shadow-lg p-5 bg-white rounded">
                    <h2 class="text-center mb-4">Verification Email Sent</h2>
                    <p>A verification email has been sent to your email address. Please check your inbox and follow the instructions to activate your account.</p>
                    <div class="d-grid">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
