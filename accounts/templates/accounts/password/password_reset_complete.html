{% extends "base.html" %}

{% block content %}
<section class="password-reset-complete py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="password-reset-wrapper shadow-lg p-5 bg-white rounded">
                    <h2 class="text-center mb-4">Password Reset Complete</h2>
                    <p>Your password has been successfully reset. You can now log in with your new password.</p>
                    <div class="d-grid">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
