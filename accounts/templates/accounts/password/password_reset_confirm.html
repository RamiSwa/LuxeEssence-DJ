{% extends "base.html" %}

{% block content %}
<section class="password-reset-confirm py-5 bg-light">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="password-reset-wrapper shadow-lg p-5 bg-white rounded">
                    <h2 class="text-center mb-4">Reset Your Password</h2>
                    <form action="{% url 'reset_password' %}" method="post">
                        {% csrf_token %}
                        
                        <div class="form-group mb-3">
                            <input type="password" class="form-control form-control-lg" name="password" placeholder="New Password" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <input type="password" class="form-control form-control-lg" name="confirm_password" placeholder="Confirm Password" required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">Reset Password</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
